# DOSBox settings for MARIO.COM  (run:  dosbox -conf MARIO.CONF)
# Put this file in the same folder as MARIO.COM.

[sdl]
fullscreen=false
# 'surface' + a whole-number scaler = sharp pixels (no blurry edges)
output=surface
windowresolution=original

[render]
aspect=false
scaler=normal2x
frameskip=0

[cpu]
core=auto
# A fixed speed that is fast enough for the game, so Ctrl+F12 is not needed.
cycles=fixed 30000

[autoexec]
mount c .
c:
MARIO.COM
exit
